name: Executar laboratorios da Guilda
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/laboratorio.yml']
permissions:
  contents: write
jobs:
  laboratorio:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Instalar ferramentas oficiais
        run: |
          python -m pip install semgrep
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Executar sequencia e registrar evidencias
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          code = base64.b64decode("")
          script = Path(os.environ['RUNNER_TEMP']) / 'laboratorio.py'
          script.write_bytes(code)
          exec(compile(code, str(script), 'exec'))
          PY
      - name: Guardar relatórios completos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-laboratorios
          path: ${{ runner.temp }}/evidencias/
